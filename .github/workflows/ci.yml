name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check lint changes
        run: git diff --exit-code

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter @nest-admin/api test -- --runInBand

      - name: Web unit tests
        run: pnpm --filter @nest-admin/web test:unit -- --run

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: 3306
      E2E_DB_USER: root
      E2E_DB_PASSWORD: root
      E2E_DB_NAME: nest_admin_test
      E2E_REDIS_URL: redis://127.0.0.1:6379/15
      E2E_ADMIN_PASSWORD: E2eAdmin123!
      E2E_JWT_ACCESS_SECRET: e2e-access-secret-must-be-long-enough
      E2E_JWT_REFRESH_SECRET: e2e-refresh-secret-must-be-long-enough
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nest_admin_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run end-to-end tests
        run: pnpm test:e2e

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Build API image
        run: docker buildx build --target api --tag nest-admin-api:ci --load .

      - name: Build Web image
        run: docker buildx build --target web --tag nest-admin-web:ci --load .

      - name: Build migration image
        run: docker buildx build --target migrate --tag nest-admin-migrate:ci --load .
