<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nest-admin</title>
    <script>
      (() => {
        try {
          const settings = JSON.parse(localStorage.getItem('settings') || '{}');
          const followsDarkSystem =
            settings.themeMode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = settings.themeMode === 'dark' || followsDarkSystem;

          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (/^#[0-9a-f]{6}$/i.test(settings.primaryColor || '')) {
            document.documentElement.style.setProperty(
              '--app-loading-primary',
              settings.primaryColor,
            );
          }
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --app-loading-bg: #fafbfc;
        --app-loading-primary: #5d87ff;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --app-loading-bg: #070707;
      }

      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }

      .app-boot-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--app-loading-bg);
      }

      .app-boot-loading__indicator {
        position: relative;
        width: 30px;
        height: 30px;
        animation: app-boot-spin 1.2s linear infinite;
        backface-visibility: hidden;
        will-change: transform;
      }

      .app-boot-loading__dot {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--app-loading-primary);
      }

      .app-boot-loading__dot:nth-child(1) {
        top: 1px;
        left: 11.5px;
      }

      .app-boot-loading__dot:nth-child(2) {
        top: 11.5px;
        right: 1px;
        opacity: 0.8;
      }

      .app-boot-loading__dot:nth-child(3) {
        bottom: 1px;
        left: 11.5px;
        opacity: 0.55;
      }

      .app-boot-loading__dot:nth-child(4) {
        top: 11.5px;
        left: 1px;
        opacity: 0.3;
      }

      @keyframes app-boot-spin {
        from {
          transform: translateZ(0) rotate(0deg);
        }

        to {
          transform: translateZ(0) rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-loading__indicator {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-loading" role="status" aria-label="应用加载中">
        <span class="app-boot-loading__indicator" aria-hidden="true">
          <span class="app-boot-loading__dot"></span>
          <span class="app-boot-loading__dot"></span>
          <span class="app-boot-loading__dot"></span>
          <span class="app-boot-loading__dot"></span>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
